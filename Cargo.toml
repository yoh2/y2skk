[workspace]
members = [
    "crates/skk-core",
    "crates/skk-ipc",
    "crates/skk-config",
    "crates/skk-daemon",
    "crates/xim-server",
    "crates/adapter-gtk3",
    "crates/adapter-gtk4",
    "crates/adapter-qt6",
    "crates/adapter-wayland",
    "crates/y2skk-indicator",
    "crates/y2skk-settings",
    "xtask",
]
resolver = "2"

[workspace.package]
version = "0.9.5"
edition = "2021"
license = "MIT"

[workspace.dependencies]
skk-core  = { path = "crates/skk-core" }
skk-ipc   = { path = "crates/skk-ipc" }
skk-config = { path = "crates/skk-config" }
zbus                = { version = "5.16.0", features = ["tokio"] }
tokio               = { version = "1.52.3", features = ["full"] }
serde               = { version = "1.0.228", features = ["derive"] }
thiserror           = "2.0.18"
anyhow              = "1.0.102"
bitflags            = "2.13.0"
tracing             = "0.1.44"
tracing-subscriber  = { version = "0.3.23", features = ["env-filter"] }
toml                = "1.1.2"
# Match the toml_edit version `toml` pulls in transitively so only one copy builds.
toml_edit           = "0.25"
serde_json          = "1.0.150"
dirs                = "6.0.0"
encoding_rs         = "0.8.35"
indexmap            = "2.14.0"
cc                  = "1.2.65"
pkg-config          = "0.3.33"
