[workspace]
members = [
    "crates/skk-core",
    "crates/skk-ipc",
    "crates/skk-daemon",
    "crates/adapter-gtk3",
    "crates/adapter-qt6",
    "crates/y2skk-indicator",
    "crates/y2skk-settings",
    "xtask",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
skk-core  = { path = "crates/skk-core" }
skk-ipc   = { path = "crates/skk-ipc" }
zbus                = { version = "5.14.0", features = ["tokio"] }
tokio               = { version = "1.51.0", features = ["full"] }
serde               = { version = "1.0.228", features = ["derive"] }
thiserror           = "2.0.18"
anyhow              = "1.0.102"
bitflags            = "2.11.0"
tracing             = "0.1.44"
tracing-subscriber  = { version = "0.3.23", features = ["env-filter"] }
toml                = "1.1.2"
dirs                = "6.0.0"
encoding_rs         = "0.8.35"
indexmap            = "2.7.1"
cc                  = "1.2.59"
pkg-config          = "0.3.32"
